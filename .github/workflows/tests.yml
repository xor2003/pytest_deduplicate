name: Test and build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.9", dependencies: minimum}
          - {os: ubuntu-latest, python: "3.10", dependencies: latest}
          - {os: ubuntu-latest, python: "3.11", dependencies: latest}
          - {os: ubuntu-latest, python: "3.12", dependencies: minimum}
          - {os: ubuntu-latest, python: "3.13", dependencies: latest}
          - {os: ubuntu-latest, python: "3.14", dependencies: latest}
          - {os: windows-latest, python: "3.12", dependencies: latest}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip build wheel setuptools "hypothesis>=6.100"
      - if: matrix.dependencies == 'minimum'
        run: python -m pip install pytest==7.4.4 coverage==7.6.1 pytest-cov==5.0.0 pytest-xdist==3.6.1
      - if: matrix.dependencies == 'latest'
        run: python -m pip install --upgrade pytest coverage pytest-cov pytest-xdist
      - run: python -m pytest -q
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      - run: python tools/check_distribution.py
